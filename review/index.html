<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio preview check</title><style>body{margin:0;background:#ded8cf;font:14px Arial;color:#30251e}header{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:10px}iframe{display:block;margin:0 auto 30px;border:0;background:white;box-shadow:0 0 0 1px #777;width:390px;height:844px}</style></head><body><header><label>Page <select id="route"><option value="/ui-ux-projects/">Work</option><option value="/">Welcome</option><option value="/about-me/">About</option><option value="/fragrancebuy-deals-vs-discovery/">FragranceBuy</option><option value="/crvnchmode-designing-a-smarter-way-to-choose-a-car/">CRVNCHMODE</option><option value="/dealer-listing-optimization-platform/">ListIQ</option><option value="/market-demand-forecaster/">Market Demand</option></select></label><button data-width="390">390px</button><button data-width="320">320px</button><button data-width="768">768px</button><output id="result"></output></header><iframe title="Responsive portfolio preview" id="preview" src="/ui-ux-projects/"></iframe><script>const frame=document.getElementById('preview');document.getElementById('route').onchange=e=>frame.src=e.target.value;document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';report()});function report(){const d=frame.contentDocument;document.getElementById('result').textContent='Viewport '+d.documentElement.clientWidth+'px / content '+d.documentElement.scrollWidth+'px'}frame.onload=report;</script></body></html>
